<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nook</title>
  <style>
    /* Reset & Stage Ground (Pure #0D0E11 to prevent any white-flash) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0D0E11;
      color: #ECEAE5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Splash Container */
    #splash-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 30px;
      transition: opacity 160ms ease-out, transform 160ms ease-out;
      will-change: opacity, transform;
    }

    /* 1. Mascot Entrance */
    .mascot-wrapper {
      position: relative;
      width: 106px;
      height: 102px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(5px);
      animation: mascotEnter 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    .mascot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.45));
    }

    .mascot-blink {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transition: opacity 60ms ease-out;
    }

    /* 2. Wordmark Nook Entrance */
    .wordmark {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #FFFFFF;
      margin-top: 14px;
      opacity: 0;
      transform: translateY(4px);
      animation: wordmarkEnter 280ms cubic-bezier(0.16, 1, 0.3, 1) 80ms forwards;
      will-change: opacity, transform;
    }

    /* 3. Minimalist Progress Rail */
    .progress-rail {
      width: 140px;
      height: 2.5px;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      margin-top: 18px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: progressEnter 240ms ease-out 140ms forwards;
      will-change: opacity;
    }

    .progress-bar {
      height: 100%;
      background-color: #FFFFFF;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      animation: progressIndeterminate 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      will-change: transform;
    }

    /* Animations Keyframes (Composite-only: transform & opacity) */
    @keyframes mascotEnter {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wordmarkEnter {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progressEnter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes progressIndeterminate {
      0% {
        transform: translateX(-100%) scaleX(0.2);
      }
      50% {
        transform: translateX(30%) scaleX(0.7);
      }
      100% {
        transform: translateX(200%) scaleX(0.2);
      }
    }

    /* Exit Fade-out */
    .fade-out {
      opacity: 0 !important;
      transform: scale(0.98) !important;
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .mascot-wrapper,
      .wordmark,
      .progress-rail {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .progress-bar {
        animation: none !important;
        width: 100% !important;
        transform: none !important;
      }
      #splash-root {
        transition: opacity 100ms ease-out !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash-root">
    <div class="mascot-wrapper">
      <img src="/brand/nook-mascot.svg" alt="Nook" class="mascot-img" />
      <img id="mascot-blink" src="/brand/mascot/nook-idle-blink.png" alt="Nook Piscando" class="mascot-blink" />
    </div>
    <div class="wordmark">Nook</div>
    <div class="progress-rail">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script type="module" src="/src/splash.ts"></script>
</body>
</html>
