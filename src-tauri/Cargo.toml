[package]
name = "app"
version = "1.0.0"
description = "Nook — Minimalist, fast, 100% local-first notes and project workspace for Windows, Web, and Mobile."
authors = ["zeitgeist2004"]
license = "MIT"
repository = "https://github.com/zeitgeist2004/Nook"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
uuid = { version = "1.29.2", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
